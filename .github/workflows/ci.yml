name: CI
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Swift version
        run: swift --version
      - name: Build (debug)
        run: swift build
      - name: Run unit tests
        run: swift test
      - name: Build (release)
        run: swift build -c release
      - name: Run acceptance tests
        run: bash AcceptanceTests/runner.sh .build/release/try
